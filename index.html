<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영단어 암기장</title>
  <meta name="description" content="매일 영단어 50개 암기 & 시험 앱">
  <meta name="theme-color" content="#1a1a1a">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="영단어">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #ffffff;
      --bg2: #f5f5f5;
      --bg3: #ebebeb;
      --text: #1a1a1a;
      --text2: #555;
      --text3: #999;
      --border: rgba(0,0,0,0.1);
      --border2: rgba(0,0,0,0.2);
      --accent: #1a1a1a;
      --accent-text: #fff;
      --green: #2d6a1f;
      --green-bg: #eaf3de;
      --red: #8b2020;
      --red-bg: #fcebeb;
      --blue: #1a4f8a;
      --blue-bg: #e6f1fb;
      --radius: 10px;
      --radius-lg: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111;
        --bg2: #1e1e1e;
        --bg3: #2a2a2a;
        --text: #f0f0f0;
        --text2: #aaa;
        --text3: #666;
        --border: rgba(255,255,255,0.1);
        --border2: rgba(255,255,255,0.2);
        --accent: #f0f0f0;
        --accent-text: #111;
        --green: #7bc257;
        --green-bg: #1a2e10;
        --red: #e07070;
        --red-bg: #2e1010;
        --blue: #6aabef;
        --blue-bg: #0d1e30;
      }
    }
    html, body { height: 100%; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }
    body { display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }

    /* HEADER */
    .header { padding: 16px 16px 0; display: flex; align-items: center; gap: 10px; }
    .header h1 { font-size: 20px; font-weight: 600; flex: 1; }
    .date-pill { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--bg2); color: var(--text2); border: 0.5px solid var(--border); cursor: pointer; }

    /* TABS */
    .tabs { display: flex; padding: 12px 16px 0; gap: 4px; border-bottom: 0.5px solid var(--border); margin-top: 12px; }
    .tab { flex: 1; padding: 8px 4px; font-size: 13px; border: none; background: none; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -0.5px; font-weight: 500; transition: color .15s; }
    .tab.active { color: var(--text); border-bottom-color: var(--text); }

    /* CONTENT */
    .content { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
    .section { display: none; }
    .section.active { display: block; }

    /* CARDS */
    .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px; }
    .card-label { font-size: 12px; color: var(--text2); margin-bottom: 8px; font-weight: 500; }

    /* INPUTS */
    input[type=text], input[type=date], select, textarea {
      width: 100%; padding: 10px 12px; border: 0.5px solid var(--border2);
      border-radius: var(--radius); font-size: 15px; background: var(--bg2);
      color: var(--text); outline: none; font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--text); box-shadow: 0 0 0 2px rgba(0,0,0,0.08); }
    textarea { height: 160px; resize: vertical; font-size: 13px; font-family: monospace; line-height: 1.5; }

    /* BUTTONS */
    .btn { padding: 11px 16px; border-radius: var(--radius); border: 0.5px solid var(--border2); font-size: 15px; cursor: pointer; background: var(--bg2); color: var(--text); font-weight: 500; font-family: inherit; transition: opacity .1s, transform .1s; }
    .btn:active { transform: scale(0.97); opacity: 0.8; }
    .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { flex: 1; }
    .btn.danger { border-color: var(--red); color: var(--red); background: var(--red-bg); }

    /* STATS */
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat-card { background: var(--bg2); border-radius: var(--radius); padding: 12px 10px; text-align: center; }
    .stat-num { font-size: 26px; font-weight: 600; }
    .stat-lbl { font-size: 11px; color: var(--text2); margin-top: 2px; }

    /* WORD LIST */
    .word-list { display: flex; flex-direction: column; gap: 6px; }
    .word-item { display: flex; align-items: center; padding: 10px 12px; background: var(--bg2); border-radius: var(--radius); gap: 10px; }
    .word-item .eng { font-weight: 600; flex: 1; }
    .word-item .kor { color: var(--text2); font-size: 14px; }
    .word-item .del { border: none; background: none; color: var(--text3); font-size: 20px; line-height: 1; cursor: pointer; padding: 0 2px; flex-shrink: 0; }
    .day-header { font-size: 12px; font-weight: 600; color: var(--text2); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.05em; }

    /* QUIZ */
    .quiz-setup {}
    .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .field-label { font-size: 12px; color: var(--text2); margin-bottom: 5px; font-weight: 500; }

    .quiz-play { text-align: center; }
    .progress-bar { height: 3px; background: var(--bg3); border-radius: 99px; margin-bottom: 16px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
    .quiz-counter { font-size: 12px; color: var(--text3); margin-bottom: 20px; }
    .quiz-day-lbl { font-size: 12px; color: var(--text2); margin-bottom: 6px; padding: 3px 10px; background: var(--blue-bg); color: var(--blue); border-radius: 99px; display: inline-block; }
    .quiz-word { font-size: 36px; font-weight: 700; margin: 12px 0 24px; line-height: 1.2; }
    .quiz-ans-input { width: 100%; padding: 14px; font-size: 18px; text-align: center; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg2); color: var(--text); font-family: inherit; outline: none; margin-bottom: 12px; }
    .quiz-ans-input:focus { border-color: var(--text); }
    .quiz-feedback { font-size: 16px; font-weight: 600; min-height: 26px; margin-bottom: 14px; }
    .quiz-feedback.ok { color: var(--green); }
    .quiz-feedback.ng { color: var(--red); }

    .quiz-done {}
    .final-score { font-size: 56px; font-weight: 700; margin-bottom: 4px; }
    .final-sub { font-size: 14px; color: var(--text2); margin-bottom: 20px; }
    .result-list { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; margin-bottom: 14px; }
    .result-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius); font-size: 14px; }
    .result-item.ok { background: var(--green-bg); }
    .result-item.ng { background: var(--red-bg); }
    .result-mark { font-size: 15px; width: 18px; flex-shrink: 0; }
    .result-word { font-weight: 600; flex: 1; }
    .result-ans { color: var(--text2); font-size: 13px; }

    /* HISTORY */
    .hist-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid var(--border); font-size: 13px; }
    .hist-item:last-child { border-bottom: none; }
    .hist-date { color: var(--text2); flex: 1; font-size: 12px; }
    .hist-range { background: var(--bg3); padding: 2px 8px; border-radius: 99px; font-size: 11px; }
    .hist-pct { font-weight: 700; font-size: 16px; min-width: 44px; text-align: right; }
    .hist-detail { color: var(--text3); font-size: 12px; }

    .empty { color: var(--text3); font-size: 14px; text-align: center; padding: 2rem 0; }
    .hint { font-size: 12px; color: var(--text3); margin-top: 6px; line-height: 1.6; }
    .status-msg { font-size: 13px; color: var(--green); min-height: 20px; margin-top: 8px; }
    .error-msg { font-size: 13px; color: var(--red); min-height: 20px; margin-top: 8px; }

    /* INSTALL BANNER */
    .install-banner { display: none; position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 448px; background: var(--accent); color: var(--accent-text); border-radius: var(--radius-lg); padding: 14px 16px; font-size: 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 100; }
    .install-banner.hidden { display: none !important; }
    .install-banner .ib-text { flex: 1; line-height: 1.4; }
    .install-banner .ib-btn { background: var(--accent-text); color: var(--accent); border: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .install-banner .ib-close { border: none; background: none; color: var(--accent-text); font-size: 20px; cursor: pointer; opacity: 0.7; padding: 0; }
  </style>
</head>
<body>

<div class="header">
  <h1>📚 영단어 암기장</h1>
  <input type="date" id="day-input" class="date-pill" style="width:auto;padding:4px 10px;font-size:12px">
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('add')">입력</button>
  <button class="tab" onclick="showTab('list')">단어장</button>
  <button class="tab" onclick="showTab('quiz')">시험</button>
  <button class="tab" onclick="showTab('history')">기록</button>
</div>

<div class="content">

  <!-- 입력 -->
  <div class="section active" id="sec-add">
    <div class="card">
      <div class="card-label">단어 붙여넣기 (한 줄에 1개)</div>
      <textarea id="bulk-input" placeholder="apple 사과
banana 바나나
cherry 체리

구분자: 공백, 탭, : / , - 모두 OK"></textarea>
      <p class="hint">예: apple 사과 · apple: 사과 · apple,사과 · apple/사과</p>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn primary" onclick="addBulk()" style="flex:2">추가하기</button>
        <button class="btn" onclick="document.getElementById('bulk-input').value=''">지우기</button>
      </div>
    </div>
    <div class="card">
      <div class="card-label">단어 직접 입력</div>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <input type="text" id="eng-input" placeholder="English" style="flex:1" onkeydown="if(event.key==='Tab'){event.preventDefault();document.getElementById('kor-input').focus()}">
        <input type="text" id="kor-input" placeholder="한글 뜻" style="flex:1" onkeydown="if(event.key==='Enter')addOne()">
      </div>
      <button class="btn primary" style="width:100%" onclick="addOne()">추가</button>
    </div>
    <div class="status-msg" id="add-status"></div>
  </div>

  <!-- 단어장 -->
  <div class="section" id="sec-list">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="stat-days">0</div><div class="stat-lbl">학습일</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-total">0</div><div class="stat-lbl">총 단어</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-today">0</div><div class="stat-lbl">오늘</div></div>
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <select id="filter-day" onchange="renderList()" style="flex:1;font-size:13px"></select>
        <button class="btn danger" style="font-size:12px;padding:7px 12px;flex-shrink:0" onclick="clearAll()">전체삭제</button>
      </div>
      <div class="word-list" id="word-list-el"></div>
    </div>
  </div>

  <!-- 시험 -->
  <div class="section" id="sec-quiz">
    <div id="quiz-setup">
      <div class="card">
        <div class="quiz-grid">
          <div>
            <div class="field-label">범위</div>
            <select id="quiz-range" onchange="toggleDaySel()">
              <option value="today">오늘 단어만</option>
              <option value="all">전체 누적</option>
              <option value="day">특정 날짜</option>
            </select>
          </div>
          <div>
            <div class="field-label">방향</div>
            <select id="quiz-dir">
              <option value="e2k">영어 → 한글</option>
              <option value="k2e">한글 → 영어</option>
            </select>
          </div>
        </div>
        <div id="day-sel-row" style="display:none;margin-bottom:12px">
          <div class="field-label">날짜 선택</div>
          <select id="quiz-day-sel"></select>
        </div>
        <button class="btn primary" style="width:100%;margin-top:4px" onclick="startQuiz()">시험 시작 →</button>
        <div class="error-msg" id="quiz-err"></div>
      </div>
    </div>

    <div id="quiz-running" style="display:none">
      <div class="progress-bar"><div class="progress-fill" id="quiz-bar"></div></div>
      <div class="quiz-play">
        <div class="quiz-counter" id="quiz-counter"></div>
        <div class="quiz-day-lbl" id="quiz-day-lbl"></div>
        <div class="quiz-word" id="quiz-word"></div>
        <div class="quiz-feedback" id="quiz-feedback"></div>
        <input class="quiz-ans-input" id="quiz-ans" type="text" placeholder="답 입력 후 Enter →"
          onkeydown="if(event.key==='Enter')checkAnswer()">
        <div class="btn-row">
          <button class="btn primary" onclick="checkAnswer()">확인</button>
          <button class="btn" onclick="skipWord()">모르겠어요</button>
        </div>
      </div>
    </div>

    <div id="quiz-done" style="display:none">
      <div class="card" style="text-align:center;padding:24px 16px">
        <div class="final-score" id="final-score"></div>
        <div class="final-sub" id="final-sub"></div>
      </div>
      <div class="result-list" id="result-list-el"></div>
      <div class="btn-row">
        <button class="btn primary" onclick="retryQuiz()">다시 시험</button>
        <button class="btn" onclick="showSetup()">설정으로</button>
      </div>
    </div>
  </div>

  <!-- 기록 -->
  <div class="section" id="sec-history">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="h-total">0</div><div class="stat-lbl">시험 횟수</div></div>
      <div class="stat-card"><div class="stat-num" id="h-avg">-</div><div class="stat-lbl">평균</div></div>
      <div class="stat-card"><div class="stat-num" id="h-best">-</div><div class="stat-lbl">최고</div></div>
    </div>
    <div class="card">
      <div class="card-label" style="margin-bottom:12px">시험 기록</div>
      <div id="hist-list"></div>
    </div>
  </div>

</div>

<!-- Install Banner (Android) -->
<div class="install-banner hidden" id="install-banner">
  <div class="ib-text">📱 홈화면에 추가하면<br>앱처럼 쓸 수 있어요!</div>
  <button class="ib-btn" id="install-btn">설치하기</button>
  <button class="ib-close" onclick="document.getElementById('install-banner').classList.add('hidden')">×</button>
</div>

<script>
// ── STATE ──
let words = JSON.parse(localStorage.getItem('voc_words') || '[]');
let history = JSON.parse(localStorage.getItem('voc_hist') || '[]');
let qWords=[], qIdx=0, qRight=0, qRes=[], qDir='e2k', qRange='today';
let deferredPrompt = null;

// ── INIT ──
const TODAY = new Date().toISOString().slice(0,10);
document.getElementById('day-input').value = TODAY;
renderAll();

// ── PWA INSTALL ──
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-banner').classList.remove('hidden');
});
document.getElementById('install-btn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-banner').classList.add('hidden');
});
window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner').classList.add('hidden');
});

// ── SERVICE WORKER ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// ── SAVE ──
function save() {
  localStorage.setItem('voc_words', JSON.stringify(words));
  localStorage.setItem('voc_hist', JSON.stringify(history));
}

// ── TABS ──
function showTab(t) {
  document.querySelectorAll('.tab').forEach((el,i) => {
    el.classList.toggle('active', ['add','list','quiz','history'][i]===t);
  });
  document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
  document.getElementById('sec-'+t).classList.add('active');
  if(t==='list') { renderList(); renderStats(); }
  if(t==='history') renderHistory();
  if(t==='quiz') populateDaySel();
}

// ── ADD ──
function parseWords(raw) {
  return raw.split('\n').map(l=>l.trim()).filter(Boolean).map(line => {
    const parts = line.split(/[\t:,\/\-]|\s+/).map(p=>p.trim()).filter(Boolean);
    if (parts.length < 2) return null;
    return { eng: parts[0].toLowerCase(), kor: parts.slice(1).join(' ') };
  }).filter(Boolean);
}

function addBulk() {
  const raw = document.getElementById('bulk-input').value.trim();
  const day = document.getElementById('day-input').value;
  if (!raw) { setStatus('add-status', '내용을 입력해주세요.', true); return; }
  const parsed = parseWords(raw);
  let added=0, dupes=0;
  parsed.forEach(({eng, kor}) => {
    if (words.find(w=>w.eng===eng&&w.day===day)) { dupes++; return; }
    words.push({eng, kor, day}); added++;
  });
  save();
  document.getElementById('bulk-input').value = '';
  setStatus('add-status', `✓ ${added}개 추가됨${dupes ? ` (중복 ${dupes}개 건너뜀)` : ''}`);
}

function addOne() {
  const eng = document.getElementById('eng-input').value.trim().toLowerCase();
  const kor = document.getElementById('kor-input').value.trim();
  const day = document.getElementById('day-input').value;
  if (!eng||!kor) { setStatus('add-status','영어와 뜻을 모두 입력해주세요.',true); return; }
  if (words.find(w=>w.eng===eng&&w.day===day)) { setStatus('add-status','이미 있는 단어예요!',true); return; }
  words.push({eng, kor, day}); save();
  document.getElementById('eng-input').value = '';
  document.getElementById('kor-input').value = '';
  document.getElementById('eng-input').focus();
  setStatus('add-status', `✓ "${eng}" 추가됨`);
}

function setStatus(id, msg, isErr=false) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.color = isErr ? 'var(--red)' : 'var(--green)';
  if (!isErr) setTimeout(() => el.textContent='', 2500);
}

// ── LIST ──
function getDays() { return [...new Set(words.map(w=>w.day))].sort(); }

function renderStats() {
  const days = getDays();
  const today = document.getElementById('day-input').value;
  document.getElementById('stat-days').textContent = days.length;
  document.getElementById('stat-total').textContent = words.length;
  document.getElementById('stat-today').textContent = words.filter(w=>w.day===today).length;
}

function renderList() {
  const dd = document.getElementById('filter-day');
  const days = getDays();
  const prev = dd.value;
  dd.innerHTML = '<option value="all">전체</option>' + days.map(d=>`<option value="${d}">${d} (${words.filter(w=>w.day===d).length}개)</option>`).join('');
  if (days.includes(prev)) dd.value = prev;
  const filt = dd.value;
  const filtered = filt==='all' ? words : words.filter(w=>w.day===filt);
  const el = document.getElementById('word-list-el');
  if (!filtered.length) { el.innerHTML='<div class="empty">단어가 없어요</div>'; return; }
  const grouped = {};
  filtered.forEach(w => { if(!grouped[w.day]) grouped[w.day]=[]; grouped[w.day].push(w); });
  el.innerHTML = Object.keys(grouped).sort().reverse().map(d =>
    `<div class="day-header">${d} · ${grouped[d].length}개</div>` +
    grouped[d].map(w =>
      `<div class="word-item">
        <span class="eng">${w.eng}</span>
        <span class="kor">${w.kor}</span>
        <button class="del" onclick="delWord('${w.eng}','${w.day}')">×</button>
      </div>`
    ).join('')
  ).join('');
}

function delWord(eng, day) {
  if (!confirm(`"${eng}" 을 삭제할까요?`)) return;
  words = words.filter(w=>!(w.eng===eng&&w.day===day));
  save(); renderList(); renderStats();
}

function clearAll() {
  if (!confirm('모든 단어를 삭제할까요?')) return;
  words = []; save(); renderList(); renderStats();
}

// ── QUIZ ──
function populateDaySel() {
  const days = getDays();
  const sel = document.getElementById('quiz-day-sel');
  sel.innerHTML = days.map(d=>`<option value="${d}">${d} (${words.filter(w=>w.day===d).length}개)</option>`).join('');
}

function toggleDaySel() {
  document.getElementById('day-sel-row').style.display =
    document.getElementById('quiz-range').value==='day' ? 'block' : 'none';
  if (document.getElementById('quiz-range').value==='day') populateDaySel();
}

function startQuiz() {
  const range = document.getElementById('quiz-range').value;
  qDir = document.getElementById('quiz-dir').value;
  qRange = range;
  const today = document.getElementById('day-input').value;
  let pool;
  if (range==='today') pool = words.filter(w=>w.day===today);
  else if (range==='all') pool = [...words];
  else { const d=document.getElementById('quiz-day-sel').value; pool=words.filter(w=>w.day===d); }
  if (!pool.length) { document.getElementById('quiz-err').textContent='해당 범위에 단어가 없어요.'; return; }
  document.getElementById('quiz-err').textContent='';
  qWords = shuffle([...pool]); qIdx=0; qRight=0; qRes=[];
  document.getElementById('quiz-setup').style.display='none';
  document.getElementById('quiz-running').style.display='block';
  document.getElementById('quiz-done').style.display='none';
  showQ();
}

function shuffle(a) {
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function showQ() {
  if (qIdx>=qWords.length) { endQuiz(); return; }
  const w = qWords[qIdx];
  document.getElementById('quiz-bar').style.width = Math.round(qIdx/qWords.length*100)+'%';
  document.getElementById('quiz-counter').textContent = `${qIdx+1} / ${qWords.length}`;
  document.getElementById('quiz-day-lbl').textContent = w.day;
  document.getElementById('quiz-word').textContent = qDir==='e2k' ? w.eng : w.kor;
  document.getElementById('quiz-feedback').textContent='';
  document.getElementById('quiz-feedback').className='quiz-feedback';
  const inp = document.getElementById('quiz-ans');
  inp.value=''; inp.disabled=false;
  setTimeout(()=>inp.focus(), 50);
}

function normalize(s) { return s.trim().toLowerCase().replace(/\s+/g,' '); }

function checkAnswer() {
  const ans = document.getElementById('quiz-ans').value;
  if (!ans.trim()) return;
  const w = qWords[qIdx];
  const correct = qDir==='e2k' ? w.kor : w.eng;
  const ok = normalize(ans)===normalize(correct);
  const fb = document.getElementById('quiz-feedback');
  if (ok) { fb.textContent='정답! ✓'; fb.className='quiz-feedback ok'; qRight++; }
  else { fb.textContent=`오답 — 정답: ${correct}`; fb.className='quiz-feedback ng'; }
  qRes.push({word: qDir==='e2k'?w.eng:w.kor, correct, user:ans.trim(), ok, day:w.day});
  document.getElementById('quiz-ans').disabled=true;
  qIdx++;
  setTimeout(showQ, 1300);
}

function skipWord() {
  const w = qWords[qIdx];
  const correct = qDir==='e2k' ? w.kor : w.eng;
  qRes.push({word: qDir==='e2k'?w.eng:w.kor, correct, user:'(건너뜀)', ok:false, day:w.day});
  qIdx++; showQ();
}

function endQuiz() {
  document.getElementById('quiz-running').style.display='none';
  document.getElementById('quiz-done').style.display='block';
  const pct = Math.round(qRight/qWords.length*100);
  document.getElementById('final-score').textContent = pct+'%';
  document.getElementById('final-sub').textContent = `${qWords.length}문제 중 ${qRight}개 정답`;
  document.getElementById('result-list-el').innerHTML = qRes.map(r=>
    `<div class="result-item ${r.ok?'ok':'ng'}">
      <span class="result-mark">${r.ok?'✓':'✗'}</span>
      <span class="result-word">${r.word}</span>
      <span class="result-ans">${r.ok ? r.correct : `${r.user} → ${r.correct}`}</span>
    </div>`
  ).join('');
  const rangeLabel = qRange==='today'?'오늘':qRange==='all'?'전체':'날짜별';
  history.unshift({date:new Date().toLocaleString('ko-KR'), range:rangeLabel, total:qWords.length, correct:qRight, pct});
  save(); renderHistory();
}

function retryQuiz() { showSetup(); setTimeout(startQuiz,0); }
function showSetup() {
  document.getElementById('quiz-setup').style.display='block';
  document.getElementById('quiz-running').style.display='none';
  document.getElementById('quiz-done').style.display='none';
}

// ── HISTORY ──
function renderHistory() {
  document.getElementById('h-total').textContent = history.length;
  if (history.length) {
    document.getElementById('h-avg').textContent = Math.round(history.reduce((a,h)=>a+h.pct,0)/history.length)+'%';
    document.getElementById('h-best').textContent = Math.max(...history.map(h=>h.pct))+'%';
  }
  const el = document.getElementById('hist-list');
  if (!history.length) { el.innerHTML='<div class="empty">아직 기록이 없어요</div>'; return; }
  el.innerHTML = history.slice(0,30).map(h=>
    `<div class="hist-item">
      <span class="hist-date">${h.date}</span>
      <span class="hist-range">${h.range}</span>
      <span class="hist-detail">${h.correct}/${h.total}</span>
      <span class="hist-pct">${h.pct}%</span>
    </div>`
  ).join('');
}

function renderAll() { renderStats(); renderList(); renderHistory(); }
</script>
</body>
</html>
